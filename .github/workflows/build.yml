
name: Build Lyra Music APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project
        run: |
          mkdir project
          unzip LyraMusic_AndroidStudio_Project.zip -d project
          find project -name settings.gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          cd project/LyraMusicAndroid
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Lyra-Music-APK
          path: project/LyraMusicAndroid/app/build/outputs/apk/debug/*.apk
